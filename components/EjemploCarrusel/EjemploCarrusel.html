<!doctype html>
<html lang="es"><head><link rel="stylesheet" href="../../colors_and_type.css"><link rel="stylesheet" href="../../_ds_bundle.css"><script src="../../_ds_bundle.js"></script><meta charset="utf-8"><title>EjemploCarrusel</title>
<style>html,body{margin:0}body{padding:16px;background:#e9e9e6;color:#0d0d0d;font-family:Barlow,Arial,sans-serif}.nota{font:500 14px/1.45 Barlow,Arial,sans-serif;color:#333;max-width:900px;margin:0 0 12px}.t{font:700 12px/1 'Barlow Condensed',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#555;margin:18px 0 8px}</style></head>
<body>
<p class="nota"><b>Carrusel de 5 slides: consejos generales para empezar.</b> Feed vertical (arriba) y su adaptación cuadrada (abajo), al 22 %. Numeración y continuidad automáticas.</p><div id="r"></div>
<script>
var r=document.getElementById('r');
['v','s'].forEach(function(f){var row=document.createElement('div');row.className='mgv-fila';row.style.marginBottom='20px';
row.innerHTML=[1,2,3,4,5].map(function(n){return '<div class="mgv-item">'+MG.escalar(MG.render('carrusel',f,{slide:n}),.22,f)+'<div class="mgv-nom">'+n+' · '+MG.PLANTILLAS.carrusel.nombresSlides[n-1]+'</div></div>'}).join('');r.appendChild(row)});
MG.listo(r);
</script>
</body></html>
