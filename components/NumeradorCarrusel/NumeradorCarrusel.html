<!doctype html>
<html lang="es"><head><link rel="stylesheet" href="../../colors_and_type.css"><link rel="stylesheet" href="../../_ds_bundle.css"><script src="../../_ds_bundle.js"></script><meta charset="utf-8"><title>NumeradorCarrusel</title>
<style>html,body{margin:0}body{padding:16px;background:#e9e9e6;color:#0d0d0d;font-family:Barlow,Arial,sans-serif}.nota{font:500 14px/1.45 Barlow,Arial,sans-serif;color:#333;max-width:900px;margin:0 0 12px}.t{font:700 12px/1 'Barlow Condensed',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#555;margin:18px 0 8px}</style></head>
<body>
<p class="nota"><b>MG / Componente / Numeración y continuidad de carrusel</b>. Indica en qué slide está la persona y que hay más contenido. Vista al 45 % sobre las líneas Oscuro y Amarillo.</p><div id="r" style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start"></div>
<script>
var r=document.getElementById('r');
MG.lienzo(r,[1,3,5].map(function(n){return '<div style="display:flex;justify-content:space-between;align-items:center">'+MG.numerador({actual:n,total:5})+(n<5?MG.sigue(n===1?'Deslizá':'Seguí'):'')+'</div>'}).join('<div style="height:36px"></div>'),{linea:'oscuro',escala:.45,ancho:1000});
MG.lienzo(r,MG.numerador({actual:2,total:5}),{linea:'amarillo',escala:.45,ancho:1000});
</script>
</body></html>
