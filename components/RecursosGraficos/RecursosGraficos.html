<html lang="es"><head><link rel="stylesheet" href="../../colors_and_type.css"><link rel="stylesheet" href="../../_ds_bundle.css"><script src="../../_ds_bundle.js"></script><meta charset="utf-8"><title>RecursosGraficos</title>
<style>html,body{margin:0}body{padding:16px;background:#e9e9e6;color:#0d0d0d;font-family:Barlow,Arial,sans-serif}.nota{font:500 14px/1.45 Barlow,Arial,sans-serif;color:#333;max-width:900px;margin:0 0 12px}.t{font:700 12px/1 'Barlow Condensed',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#555;margin:18px 0 8px}</style></head>
<body>
<p class="nota">Máximo <b>dos recursos</b> por pieza además del logo. Al 45 %.</p><div id="r" style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start"></div>

var a='<p class="mg-etiqueta-t mg-sec">Separador barra · motivo del logo</p><div style="height:24px"></div>'+MG.separador()+'<div style="height:24px"></div>'+MG.separador({corto:true})+

MG.lienzo(r,b,{linea:'oscuro',escala:.45,ancho:1000});
